# Nginx site for snipio.akt9802.in
# Copy to: /etc/nginx/sites-available/snipio
#
# First-time SSL:
#   1. Use the HTTP-only server block (comment out the 443 server).
#   2. sudo certbot --nginx -d snipio.akt9802.in -d www.snipio.akt9802.in
# Certbot rewrites this file with the certificate paths.
#
# Ports on the VM (host network):
#   Next.js     → 127.0.0.1:3002
#   Socket.IO   → 127.0.0.1:3003   (proxied at /socket.io/)

map $http_upgrade $snipio_connection {
    default upgrade;
    ''      close;
}

upstream snipio_web {
    server 127.0.0.1:3002;
    keepalive 64;
}

upstream snipio_socket {
    server 127.0.0.1:3003;
    keepalive 64;
}

server {
    server_name snipio.akt9802.in www.snipio.akt9802.in;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss font/truetype font/opentype image/svg+xml;

    # Slides are base64-encoded over Socket.IO (up to ~7 MB on the wire).
    client_max_body_size 12M;

    location /socket.io/ {
        proxy_pass http://snipio_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $snipio_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://snipio_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    location /_next/static {
        proxy_pass http://snipio_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://snipio_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /favicon.ico {
        proxy_pass http://snipio_web;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://snipio_web;
        access_log off;
        log_not_found off;
    }

    location = /sw.js {
        proxy_pass http://snipio_web;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/snipio.akt9802.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snipio.akt9802.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.snipio.akt9802.in) {
        return 301 https://$host$request_uri;
    }
    if ($host = snipio.akt9802.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name snipio.akt9802.in www.snipio.akt9802.in;
    return 404;
}
