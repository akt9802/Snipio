<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snipio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF8F5;
      --bg-elevated: #FFFFFF;
      --bg-surface: #F5F2EE;
      --border: rgba(26,23,20,0.10);
      --text-primary: #1A1714;
      --text-secondary: #5C5752;
      --text-muted: #8E8880;
      --accent: #E8642A;
      --accent-soft: rgba(232,100,42,0.12);
      --success: #27A05A;
      --success-soft: rgba(39,160,90,0.10);
      --error: #D94040;
      --error-soft: rgba(217,64,64,0.10);
      --warning: #C97B1E;
      --warning-soft: rgba(201,123,30,0.12);
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .header-logo {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .header-title span {
      color: var(--accent);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      min-height: 40px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-muted);
      transition: background 0.2s ease;
    }

    .status-dot.connecting {
      background: var(--warning);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-dot.connected {
      background: var(--success);
    }

    .status-dot.error {
      background: var(--error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 12.5px;
      color: var(--text-secondary);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-text.connected { color: var(--success); font-weight: 500; }
    .status-text.error { color: var(--error); }
    .status-text.connecting { color: var(--warning); }

    .body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .field input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 14px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-weight: 600;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .field input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0;
    }

    .advanced-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      padding: 0;
    }

    .advanced-toggle:hover { color: var(--text-secondary); }

    .advanced-toggle svg {
      width: 12px;
      height: 12px;
      transition: transform 0.15s ease;
    }

    .advanced-toggle.open svg { transform: rotate(90deg); }

    .advanced-section {
      display: none;
      flex-direction: column;
      gap: 5px;
    }

    .advanced-section.open { display: flex; }

    .advanced-section input {
      height: 32px;
      font-size: 12.5px;
      letter-spacing: 0;
      font-weight: 400;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }

    .btn {
      width: 100%;
      height: 38px;
      border: none;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:disabled:active { transform: none; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: #EDE9E4; }

    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--border);
    }

    .hint {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 10.5px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      background: var(--bg-surface);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="header-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="#E8642A"/>
    </svg>
    <span class="header-title">Snip<span>io</span></span>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">Not connected</span>
  </div>

  <div class="body">
    <div class="field">
      <label for="room-input">Room code</label>
      <input
        id="room-input"
        type="text"
        placeholder="DBMS-4821"
        maxlength="9"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <button class="btn btn-primary" id="action-btn" type="button">
      Join Room
    </button>

    <button class="advanced-toggle" id="advanced-toggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
      Advanced
    </button>

    <div class="advanced-section" id="advanced-section">
      <div class="field">
        <label for="socket-url-input">Socket server URL</label>
        <input
          id="socket-url-input"
          type="text"
          placeholder="http://localhost:3001"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
  </div>

  <div class="footer">
    <p class="hint">Press <kbd>Alt+S</kbd> while a lecture is playing to send the current frame to your tablet.</p>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
